name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    # No repositório original as atividades ainda não estão resolvidas; os testes rodam nos forks.
    if: github.repository != 'roberiof/trilhaufpe-fullstack'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
